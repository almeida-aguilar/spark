name: Deploy Spark Editor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 1. Build task-herder
      - name: Build task-herder
        run: npm run build --workspace=@scratch/task-herder

      # 2. Build scratch-storage
      - name: Build scratch-storage
        run: npm run build --workspace=@scratch/scratch-storage

      # 3. Build scratch-render
      - name: Build scratch-render
        run: npm run build --workspace=@scratch/scratch-render

      # 4. (Opcional) Build scratch-vm, si tu GUI lo necesita
      # - name: Build scratch-vm
      #   run: npm run build --workspace=@scratch/scratch-vm

      # 5. Build scratch-gui
      - name: Build scratch-gui
        run: |
          cd packages/scratch-gui
          npm run build:dev

      # 6. Deploy a GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./packages/scratch-gui/build
          keep_files: false
          user_name: actions-user
          user_email: actions@github.com
