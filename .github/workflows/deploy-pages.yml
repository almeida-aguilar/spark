name: Deploy Spark Editor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Construye TODOS los workspaces en el orden correcto
      # (task-herder, scratch-storage, scratch-svg-renderer, scratch-render,
      # scratch-vm, scratch-paint, scratch-gui, etc.), igual que ci.yml.
      - name: Build all packages
        run: npm run build

      - name: Verify build output
        run: |
          ls -l packages/scratch-gui/build
          test -f packages/scratch-gui/build/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./packages/scratch-gui/build
          keep_files: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
