name: Deploy Spark Editor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 1. Build task-herder (sin dependencias críticas)
      - name: Build task-herder
        run: npm run build --workspace=@scratch/task-herder

      # 2. Build scratch-storage (assets de biblioteca)
      - name: Build scratch-storage
        run: npm run build --workspace=@scratch/scratch-storage

      # 3. Build scratch-render (dependency clave para scratch-vm)
      - name: Build scratch-render
        run: npm run build --workspace=@scratch/scratch-render

      # 4. Build scratch-vm (ahora que scratch-render está buildado)
      - name: Build scratch-vm
        run: npm run build --workspace=@scratch/scratch-vm || true

      # 5. Build scratch-gui (el GUI principal)
      - name: Build scratch-gui
        run: |
          cd packages/scratch-gui
          npm run build:dev

      # 6. Deploy a GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false
          user_name: actions-user
          user_email: actions@github.com
